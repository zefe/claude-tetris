name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

# Evita analisis duplicados en paralelo si el issue se edita varias veces seguidas
concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Guarda anti-bucle: no re-analizar ediciones hechas por bots
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage con Claude
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh label list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"'
          prompt: |
            Eres el triador de issues del repositorio ${{ github.repository }}.
            Analiza el issue #${{ github.event.issue.number }} y responde SIEMPRE en español.

            ## Paso 1 - Leer el issue
            Ejecuta: gh issue view ${{ github.event.issue.number }} --json number,title,body,labels,author
            Lee el titulo y el cuerpo completos.

            ## Paso 2 - Entender el codigo real
            El repositorio esta disponible en el working directory. Usa Read/Grep/Glob para
            inspeccionar los archivos relevantes (por ejemplo game.js, index.html, style.css,
            README.md) ANTES de diagnosticar. El diagnostico debe citar archivos, funciones y
            lineas que existan de verdad. No inventes nombres de funciones ni de archivos:
            si citas un simbolo, tienes que haberlo visto al leer el codigo.

            ## Paso 3 - Asignar labels (SOLO las que ya existen)
            Ejecuta: gh label list
            Elige UNICAMENTE labels de esa lista. Reglas estrictas:
            - PROHIBIDO crear labels nuevas. Nunca ejecutes `gh label create`.
            - PROHIBIDO quitar labels que ya esten puestas manualmente. Solo agrega.
            - Aplica las que correspondan con:
              gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"
            - Si ninguna label existente aplica razonablemente, NO asignes ninguna: indicalo en
              el comentario y sugiere que label convendria crear (sin crearla tu).

            ## Paso 4 - Publicar el diagnostico
            Publica un comentario en el issue con:
              gh issue comment ${{ github.event.issue.number }} --body "..."
            (usa --body-file con un fichero temporal si el texto es largo o tiene comillas).

            El comentario debe seguir EXACTAMENTE esta estructura en markdown:

            ## Diagnostico automatico

            **Resumen**
            Reformulacion del problema en 1-2 frases.

            **Tipo y severidad**
            Tipo: bug | mejora | documentacion | pregunta. Severidad: baja | media | alta,
            con una frase de justificacion.

            **Causa raiz probable**
            Basada en la lectura real del codigo, no en especulacion generica. Explica el
            mecanismo concreto por el que se produce el problema.

            **Archivos y funciones implicadas**
            Lista de rutas y simbolos concretos (por ejemplo `game.js:rotate()`), verificados
            leyendo el repositorio.

            **Plan de solucion propuesto**
            Pasos ordenados y accionables, suficientemente concretos para implementarlos.

            **Criterios de aceptacion**
            Como se comprueba que el problema quedo resuelto.

            **Complejidad estimada**
            baja | media | alta, con justificacion breve.

            **Labels asignadas**
            Cuales se aplicaron y por que. Si no se aplico ninguna, explica el motivo.

            ---
            *Diagnostico generado automaticamente como base para la implementacion.
            Para pedir el codigo, comenta `@claude implementa el diagnostico`.*

            ## Reglas finales
            - Si el issue es ambiguo o le falta informacion, DILO explicitamente y lista las
              preguntas pendientes en lugar de inventar un diagnostico.
            - NO escribas ni modifiques codigo, no hagas commits y no abras pull requests.
              Este workflow solo analiza y comenta.
            - Si el issue no describe un problema del repositorio (spam, off-topic), no
              asignes labels y publica un comentario breve indicandolo.
